# Every push and pull request: backend lint and tests against real PostgreSQL and Redis,
# and the front end's tests and production build. No AWS: the tests force the mock model,
# mock speech and the scripted host, whatever the environment says.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: greeo
          POSTGRES_USER: greeo
          POSTGRES_PASSWORD: greeo-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greeo" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install
        run: python -m pip install -r backend/requirements/dev.txt
      - name: Lint
        working-directory: backend   # as `make lint` does
        run: ruff check . && ruff format --check .
      - name: Test
        run: |
          set -a; . ./.env.example; set +a
          export DATABASE_URL=postgresql://greeo:greeo-local-only@127.0.0.1:5432/greeo
          export REDIS_URL=redis://127.0.0.1:6379/0
          cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
