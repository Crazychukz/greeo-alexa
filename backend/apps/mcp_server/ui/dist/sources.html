<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Greeo: The sources</title>
<style>
/* Greeo design system, in the Echo Show's own card style: slate panels on the screen's
   night blue, a small label over a plain title, firelight only for proverbs and progress.
   No external assets. The page itself is transparent, so the card sits on the screen. */
:root {
  --night: #0b1424; --card: rgba(58, 68, 84, .72); --panel: rgba(255, 255, 255, .07);
  --line: rgba(255, 255, 255, .08); --hover: rgba(255, 255, 255, .13);
  --ink: #f3f5f8; --muted: #b6bdc8; --fire: #f2a541; --ember: #e8794a; --on-fire: #1a1408;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --gap: 12px; --radius: 16px; --inset-t: 0px; --inset-r: 0px; --inset-b: 0px; --inset-l: 0px;
}
:root[data-theme="light"] {
  --night: #fbf5e9; --card: rgba(255, 255, 255, .85); --panel: rgba(25, 29, 44, .05);
  --line: rgba(25, 29, 44, .1); --hover: rgba(25, 29, 44, .09);
  --ink: #191d2c; --muted: #4b4f61; --fire: #8f4a00; --ember: #a3401c; --on-fire: #fffaf0;
}
/* Stated, not left to the meta tag: a browser keeps an embedded card see-through only
   when the card's colour scheme matches the one its host gives the frame. */
:root { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--ink); }
body {
  font: 15px/1.5 var(--sans);
  padding: var(--inset-t) var(--inset-r) var(--inset-b) var(--inset-l);
}
.card {
  max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap);
  padding: 16px 18px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
}
.size-l .card { max-width: 1100px; }
/* A host that gives the card a fixed height: fill it, scroll the text inside, and keep
   the header and the buttons in view. A host that sizes to content never sets this. */
.fixed-height, .fixed-height body { height: 100%; }
.fixed-height .card { height: 100%; }
.fixed-height .content { min-height: 0; overflow-y: auto; }
.fixed-height .top, .fixed-height .strip, .fixed-height .next { flex: none; }

/* Header, like the reference's "Luxury Spa" over "Hammer and Steam". */
.top { display: flex; align-items: flex-start; gap: 4px 12px; flex-wrap: wrap; }
.heading { flex: 1 1 220px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 6px; font: 500 12px/1.3 var(--sans); color: var(--muted); }
.moon { width: 14px; height: 14px; flex: none; }
.moon .disc { fill: var(--muted); } .moon .bite { fill: #3a4454; }
.title { margin: 2px 0 0; font: 600 17px/1.3 var(--sans); color: var(--ink); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--muted); background: var(--panel); white-space: nowrap; }
.chip.fire { color: var(--fire); }

.strip { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.strip li { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 3px 9px; border-radius: 999px; background: var(--panel); color: var(--muted); }
.strip li[data-state="heard"] { color: var(--ink); }
.strip li[data-state="heard"]::before { content: "\2713\00a0"; }
.strip li[data-state="current"] { background: var(--fire); color: var(--on-fire); }

.content { flex: 1; display: flex; flex-direction: column; gap: var(--gap); }
.content h2 { margin: 0; font: 600 12px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.content p { margin: 0; }
.panel { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.calm { font: italic 15px/1.5 var(--sans); color: var(--muted); text-align: center; padding: 16px 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* What to ask next, as small option cards, like the reference's "Afternoon" tiles. */
.next { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.next .label { width: 100%; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.next button { font: 600 13px/1.2 var(--sans); color: var(--ink); background: var(--panel); border: 0; border-radius: 12px; padding: 10px 14px; min-height: 40px; cursor: pointer; }
.next button:hover { background: var(--hover); }
.next button:focus-visible { outline: 3px solid var(--fire); outline-offset: 2px; }
.next button:disabled { opacity: .5; cursor: default; }

/* Motion moves text a little but never hides it: a host that pauses animations still shows it. */
@media (prefers-reduced-motion: no-preference) {
  .content > * { animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
.evidence { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.evidence .headline { font: 500 15px/1.4 var(--sans); }
.evidence .who { font-weight: 700; }
.group { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body data-card="sources">
<div class="card">
  <header class="top">
    <div class="heading">
      <div class="brand">
        <svg class="moon" viewBox="0 0 26 26" aria-hidden="true" focusable="false">
          <circle class="disc" cx="13" cy="13" r="11"/><circle class="bite" cx="18" cy="10" r="9"/>
        </svg>
        <span>Greeo · The sources</span>
      </div>
      <h1 class="title" id="title">The sources</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <ol class="strip" id="strip" aria-label="Parts of this story"></ol>
  <main class="content" id="content">
    <p class="calm">Waiting for the story&hellip;</p>
  </main>
  <footer class="next" id="next" aria-label="You can ask for"></footer>
</div>
<script>
/* The bridge: MCP Apps JSON-RPC over postMessage. No storage, no network. */
(function () {
  "use strict";
  var G = window.Greeo = { context: {}, render: null };
  var pending = {}, nextId = 1, closed = false;
  var byId = function (id) { return document.getElementById(id); };

  /* Build DOM with text nodes only, so story text can never become markup. */
  G.el = function (tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "class") node.className = attrs[key];
      else if (attrs[key] !== undefined && attrs[key] !== null) node.setAttribute(key, attrs[key]);
    });
    [].concat(children || []).forEach(function (child) {
      if (child !== undefined && child !== null && child !== "") {
        node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
      }
    });
    return node;
  };
  G.chip = function (text, extra) { return G.el("span", { class: "chip " + (extra || "") }, text); };
  G.calm = function (text) { return G.el("p", { class: "calm" }, text); };
  G.sources = function (refs) {
    return G.el("div", { class: "row" }, (refs || []).map(function (ref) {
      return G.chip(ref.publisher + (ref.date ? " · " + ref.date : ""));
    }));
  };

  function post(message) { if (window.parent !== window) window.parent.postMessage(message, "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      post({ jsonrpc: "2.0", id: id, method: method, params: params });
    });
  }
  function notify(method, params) { post({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function applyContext(partial) {
    var ctx = G.context, root = document.documentElement;
    Object.keys(partial || {}).forEach(function (key) { ctx[key] = partial[key]; });
    root.setAttribute("data-theme", ctx.theme === "light" ? "light" : "dark");
    var box = ctx.containerDimensions || {};
    var width = box.width || box.maxWidth || ctx.maxWidth || window.innerWidth;
    root.classList.remove("size-s", "size-m", "size-l");
    root.classList.add(width < 600 ? "size-s" : width >= 1000 ? "size-l" : "size-m");
    /* MCP Apps: containerDimensions.height means a fixed frame; maxHeight means flexible. */
    root.classList.toggle("fixed-height", typeof box.height === "number");
    var inset = ctx.safeAreaInsets || {};
    ["top", "right", "bottom", "left"].forEach(function (side) {
      root.style.setProperty("--inset-" + side.charAt(0), (inset[side] || 0) + "px");
    });
  }

  function renderStrip(progress) {
    var strip = byId("strip");
    strip.replaceChildren();
    ((progress || {}).steps || []).forEach(function (step) {
      var item = G.el("li", { "data-state": step.state }, step.label);
      if (step.state === "current") item.setAttribute("aria-current", "step");
      if (step.state === "heard") item.setAttribute("aria-label", step.label + ", heard");
      strip.appendChild(item);
    });
    strip.hidden = !strip.children.length;
  }

  function renderNext(labels) {
    var next = byId("next");
    next.replaceChildren();
    if (!labels || !labels.length) return;
    next.appendChild(G.el("span", { class: "label" }, "You can ask for"));
    labels.slice(0, 5).forEach(function (label) {
      var button = G.el("button", { type: "button" }, label);
      button.disabled = closed;
      button.addEventListener("click", function () {
        if (closed) return;
        request("ui/message", { role: "user", content: { type: "text", text: label } }).catch(function () {});
      });
      next.appendChild(button);
    });
  }

  function textOf(result) {
    return ((result && result.content) || []).map(function (block) { return block.text || ""; }).join(" ").trim();
  }

  function show(result) {
    var data = (result && result.structuredContent) || {};
    var content = byId("content");
    byId("meta").replaceChildren();
    if (data.title) byId("title").textContent = data.title;
    renderStrip(data.progress);
    content.replaceChildren();
    var failed = !!(result && result.isError) || !!data.error;
    try {
      if (failed || !G.render) content.appendChild(G.calm(data.spoken || textOf(result) || "Nothing to show just now."));
      else G.render(data, content, byId("meta"));
    } catch (problem) {
      content.replaceChildren(G.calm(data.spoken || textOf(result) || "Nothing to show just now."));
    }
    if (!content.children.length) content.appendChild(G.calm(data.spoken || "Nothing to show just now."));
    renderNext(data.next_options);
  }
  G.show = show;

  window.addEventListener("message", function (event) {
    var message = event.data;
    if (event.source !== window.parent || !message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && !message.method) {
      var waiting = pending[message.id];
      if (!waiting) return;
      delete pending[message.id];
      if (message.error) waiting.reject(message.error); else waiting.resolve(message.result);
      return;
    }
    switch (message.method) {
      case "ui/notifications/tool-input": G.input = (message.params || {}).arguments || {}; break;
      case "ui/notifications/tool-result": show(message.params); break;
      case "ui/notifications/tool-cancelled":
        byId("content").replaceChildren(G.calm("That was stopped. Ask again whenever you like.")); break;
      case "ui/notifications/host-context-changed": applyContext(message.params); break;
      case "ui/resource-teardown":
        closed = true;
        [].forEach.call(document.querySelectorAll("button"), function (b) { b.disabled = true; });
        post({ jsonrpc: "2.0", id: message.id, result: {} }); break;
      case "ping": post({ jsonrpc: "2.0", id: message.id, result: {} }); break;
    }
  });

  if (window.ResizeObserver) {
    var timer = null;
    new ResizeObserver(function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var root = document.documentElement;
        notify("ui/notifications/size-changed", { width: root.scrollWidth, height: root.scrollHeight });
      }, 60);
    }).observe(document.body);
  }

  applyContext({});
  request("ui/initialize", {
    appInfo: { name: "greeo-" + document.body.getAttribute("data-card"), version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyContext((result && result.hostContext) || {});
    notify("ui/notifications/initialized");
  }).catch(function () { notify("ui/notifications/initialized"); });
})();
/* The sources: evidence cards grouped by what they support. Links are never shown. */
Greeo.render = function (data, content) {
  var G = Greeo, sources = data.sources || [];
  if (!sources.length) { content.appendChild(G.calm("No sources are available for this story.")); return; }
  var groups = [["facts", "Behind the facts"], ["context", "Behind the background"], ["perspectives", "Behind the perspectives"]];
  groups.forEach(function (group) {
    var cards = sources.filter(function (source) { return (source.supports || []).indexOf(group[0]) >= 0; });
    if (!cards.length) return;
    content.appendChild(G.el("section", { class: "group" }, [
      G.el("h2", {}, group[1]),
      G.el("div", { class: "evidence" }, cards.map(function (source) {
        return G.el("article", { class: "panel" }, [
          G.el("p", { class: "who" }, source.publisher),
          G.el("p", { class: "headline" }, source.headline),
          G.el("div", { class: "row" }, [G.chip(source.date)])
        ]);
      }))
    ]));
  });
};
</script>
</body>
</html>
