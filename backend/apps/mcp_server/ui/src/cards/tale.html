<style>
.beat { font: 400 16px/1.6 var(--sans); }
.beat mark { background: none; color: var(--fire); font-style: italic; }
.beat .badge { display: inline-block; margin-left: 8px; vertical-align: middle; font: 700 .7rem/1 var(--sans); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--on-fire); background: var(--fire); border-radius: 999px; padding: 4px 10px; }
.dots { display: flex; gap: 8px; align-items: center; }
.dots i { width: 8px; height: 8px; border-radius: 999px; background: var(--panel); }
.dots i.done { background: var(--muted); }
.dots i.now { width: 22px; background: var(--fire); }
</style>
<script>
/* The tale: one beat in large type; the proverb is highlighted with its culture. */
Greeo.render = function (data, content, meta) {
  var G = Greeo, text = data.text || data.spoken || "";
  if (data.tone_served) meta.appendChild(G.chip(data.tone_served + " telling", "fire"));
  if (data.voice_name) meta.appendChild(G.chip(data.voice_name));
  var parts = [], rest = text;
  (data.proverbs_used || []).forEach(function (proverb) {
    var at = proverb.spoken_form ? rest.indexOf(proverb.spoken_form) : -1;
    if (at < 0) return;
    parts.push(rest.slice(0, at), G.el("mark", {}, proverb.spoken_form),
      G.el("span", { class: "badge" }, proverb.culture + " proverb"));
    rest = rest.slice(at + proverb.spoken_form.length);
  });
  parts.push(rest);
  content.appendChild(G.el("p", { class: "beat" }, parts));
  var total = data.beats_total || 0, beat = data.beat || 0;
  if (total > 1) {
    var dots = [];
    for (var i = 1; i <= total; i++) dots.push(G.el("i", { class: i < beat ? "done" : i === beat ? "now" : "" }));
    content.appendChild(G.el("div", { class: "dots", role: "img", "aria-label": "Part " + beat + " of " + total }, dots));
  }
};
</script>
