# Controlled vocabulary for story and proverb matching. Additions require review.
adaptation: Adjusting to changed conditions.
ambition: Striving for achievement, influence, or advancement.
care: Supporting people's wellbeing and safety.
change: Transition from one condition, system, or way of life to another.
community: Shared life, belonging, and mutual responsibility.
competition: Rivalry for advantage, recognition, resources, or opportunity.
consequence: Outcomes that follow actions, choices, or events.
cooperation: Working together toward a common aim.
courage: Acting despite difficulty or fear.
deception: Misleading others, concealing truth, or creating false impressions.
dignity: Respect for each person's worth.
education: Learning, teaching, and access to knowledge.
environment: Relationships with land, water, climate, and ecosystems.
fairness: Equitable treatment and processes.
foresight: Preparing thoughtfully for likely consequences.
generosity: Giving, sharing, or helping beyond obligation.
grief: Loss, remembrance, and mourning.
health: Public, personal, and community health.
home: Housing, displacement, and belonging to place.
humility: Recognizing limits, remaining teachable, and avoiding excessive pride.
innovation: New methods, tools, or approaches.
justice: Accountability, rights, and lawful remedy.
leadership: Stewardship, decision-making, and public responsibility.
livelihoods: Work, income, and economic security.
memory: Remembering, heritage, and lessons from the past.
opportunity: Circumstances that enable advancement or beneficial action.
patience: Steady persistence over time.
peace: Safety, reconciliation, and reduced conflict.
power: The ability to influence people, institutions, resources, or outcomes.
prudence: Exercising careful judgment before acting.
resilience: Recovering and continuing after disruption.
responsibility: Duties and consequences of choices.
risk: Acting under uncertainty with possible loss or harm.
scarcity: Limited resources relative to needs or desires.
self_interest: Pursuing personal or group advantage.
trade: Exchange, markets, and movement of goods.
transformation: Fundamental change in identity, structure, capability, or direction.
trust: Reliability between people and institutions.
uncertainty: Acting or deciding when outcomes or information remain unclear.
unity: Solidarity across difference without erasing it.
