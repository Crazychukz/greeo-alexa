<!-- Greeo's logo, top centre of the page. The night version (cream trunk and moon) sits on
     the dark page, which goes with the light device. -->
<a class="brand-logo" routerLink="/" aria-label="Greeo home">
  <img
    [src]="deviceFinish() === 'dark' ? 'greeo-tree-logo.svg' : 'greeo-tree-logo-night.svg'"
    alt="Greeo"
    width="44"
    height="48"
  />
</a>

<div class="controls">
  <label class="switch">
    <button
      type="button"
      role="switch"
      class="track"
      [attr.aria-checked]="deviceFinish() === 'dark'"
      (click)="toggleDeviceFinish()"
    >
      <span class="knob" aria-hidden="true">
        <!-- A small display on its stand -->
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M9 20h6M12 16v4" /></svg>
      </span>
    </button>
    <span class="switch-label">Dark device</span>
  </label>
  <label class="switch">
    <button
      type="button"
      role="switch"
      class="track"
      [attr.aria-checked]="isFullscreen()"
      (click)="toggleFullscreen()"
    >
      <span class="knob" aria-hidden="true">
        <!-- Four corners opening outward -->
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
      </span>
    </button>
    <span class="switch-label">Full screen</span>
  </label>
</div>

<!-- The device is the app: every page renders on its display. -->
<main class="stage">
  <div class="device">
    <div class="screen">
      <div class="camera" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="display">
        <nav class="screen-nav">
          <div class="nav-left-col">
            @if (!onHome()) {
              <span>
                <a class="nav-btn" routerLink="/" aria-label="Home">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="home-icon">
                    <path d="M3.5 11.5L12 4l8.5 7.5" />
                    <path d="M6 10v9.5h4.5v-5.5h3v5.5H18V10" />
                  </svg>
                </a>
              </span>
            }
            <span>
              <button
                #frictionButton
                type="button"
                class="nav-btn"
                aria-label="Friction log"
                [attr.aria-expanded]="sheet() === 'friction'"
                (click)="sheet.set('friction')"
              >
                <svg viewBox="0 0 100 80" fill="white" aria-hidden="true">
                  <rect width="100" height="10" rx="5"></rect>
                  <rect y="32.5" width="90" height="10" rx="5"></rect>
                  <rect y="65" width="70" height="10" rx="5"></rect>
                </svg>
              </button>
            </span>
            <span>
              <button
                #aboutButton
                type="button"
                class="nav-btn"
                aria-label="About Greeo"
                [attr.aria-expanded]="sheet() === 'about'"
                (click)="sheet.set('about')"
              >
                <svg fill="#ffffff" viewBox="0 0 30.063 30.063" aria-hidden="true">
                  <g>
                    <path
                      d="M17.629,26.584l2.391,0.127v3.353h-9.977v-3.187l1.384-0.125c0.754-0.086,1.215-0.336,1.215-1.342V13.756
                      c0-0.926-0.252-1.219-1.049-1.219l-1.466-0.082V8.976h7.502V26.584z M14.696,0c1.845,0,3.187,1.387,3.187,3.146
                      c0,1.763-1.342,3.062-3.229,3.062c-1.927,0-3.187-1.301-3.187-3.062C11.467,1.386,12.727,0,14.696,0z"
                    />
                  </g>
                </svg>
              </button>
            </span>
          </div>
          <div class="nav-right-col">
            @if (appWeather() !== null) {
              <span class="weather-label">{{ appWeather() }}°</span>
            }
            <span>{{ appTime() }}</span>
          </div>
        </nav>
        <div id="page-wrapper" class="page-wrapper">
          <router-outlet />
        </div>
        @switch (sheet()) {
          @case ('about') {
            <greeo-about-panel (closed)="closeSheet()" />
          }
          @case ('friction') {
            <greeo-friction-panel (closed)="closeSheet()" />
          }
        }
      </div>
    </div>
    <div class="base" aria-hidden="true"></div>
  </div>
</main>
