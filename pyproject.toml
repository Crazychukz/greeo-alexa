[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy", "backend/apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["backend/tests"]
